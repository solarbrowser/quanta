name: JIT check (ARM)

# Run by hand only (Actions tab -> "JIT check (ARM)" -> Run workflow). Builds the engine on real
# AArch64 hardware (Apple Silicon, Linux and Windows) and runs a smoke test with the baseline JIT forced on
# for a small loop, which fails if the JIT compiled nothing: a process that cannot map executable
# memory leaves every function interpreted, and that must not look like a pass.

on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            arch_flags: '-mcpu=apple-m1'
          - name: Linux (AArch64)
            os: ubuntu-24.04-arm
            arch_flags: '-mcpu=generic'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang + lld (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build
        env:
          QUANTA_ARCH_FLAGS: ${{ matrix.arch_flags }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Smoke test
        run: |
          echo 'console.log(1 + 2)' > /tmp/smoke.js
          build/bin/quanta /tmp/smoke.js

      - name: JIT smoke test
        run: |
          cat > /tmp/jit.js <<'JS'
          function f(n) { var s = 0; for (var i = 0; i < n; i++) { s += i * 2 - 1; } return s; }
          console.log(f(100000));
          JS
          QUANTA_JIT_LOG=1 QUANTA_JIT_THRESHOLD=1 QUANTA_JIT_MODE=0 build/bin/quanta /tmp/jit.js 2>&1 | grep -v tally | tee /tmp/jit.out
          grep -q '^9999800000$' /tmp/jit.out
          grep -q 'compiled=[1-9]' /tmp/jit.out

  windows-arm:
    name: Windows (ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM/Clang
        run: choco install llvm -y --no-progress

      - name: Build
        shell: cmd
        run: build-windows.bat

      - name: Smoke test
        shell: cmd
        run: |
          echo console.log(1 + 2) > smoke.js
          build\bin\quanta.exe smoke.js

      - name: JIT smoke test
        shell: pwsh
        run: |
          @'
          function f(n) { var s = 0; for (var i = 0; i < n; i++) { s += i * 2 - 1; } return s; }
          console.log(f(100000));
          '@ | Set-Content -Path jit.js
          $env:QUANTA_JIT_LOG = "1"
          $env:QUANTA_JIT_THRESHOLD = "1"
          $env:QUANTA_JIT_MODE = "0"
          $out = & build\bin\quanta.exe jit.js 2>&1 | Where-Object { $_ -notmatch "tally" }
          $out
          if (-not ($out -match "^9999800000$")) { throw "wrong result" }
          if (-not ($out -match "compiled=[1-9]")) { throw "the JIT compiled nothing" }
