name: Homebrew LLVM (macOS bench)

# Run by hand only (Actions tab -> "Homebrew LLVM (macOS bench)" -> Run workflow).
#
# Builds the engine on Apple Silicon with Homebrew's LLVM instead of Apple's clang, to see what the two things
# Apple's toolchain leaves out are worth: build.sh's profile-guided optimisation (tools/pgo/quanta.profdata is
# written by a newer LLVM than Apple clang ships, which then says "not readable by this clang" and builds without
# it) and ThinLTO (build.sh asks for ld.lld, which the runner does not have). Then it runs the same v8-v7 suite as
# the Benchmark workflow, so the two summaries can be set side by side, and keeps the executable as a zip like
# Build (macOS) does.
#
# The executable links against the system libc++ (the Homebrew clang uses the SDK's headers and library by
# default), so it runs on a Mac without Homebrew's LLVM.

on:
  workflow_dispatch:
    inputs:
      benchmark_ref:
        description: 'Branch, tag or commit of ahaoboy/js-engine-benchmark'
        required: false
        default: 'main'

jobs:
  bench:
    # Two builds side by side on the same kind of runner: Homebrew's LLVM alone, and with C++ allocation sent to mimalloc as it is on
    # Linux (QUANTA_APPLE_MIMALLOC; the executable must not be stripped: see src/core/runtime/MiMalloc.cpp).
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: llvm
            extra_flags: ''
          - variant: llvm-mimalloc
            extra_flags: '-DQUANTA_APPLE_MIMALLOC'
    name: macOS (Apple Silicon, Homebrew LLVM, ${{ matrix.variant }})
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Homebrew LLVM and lld
        run: |
          brew install llvm lld
          LLVM_PREFIX="$(brew --prefix llvm)"
          LLD_PREFIX="$(brew --prefix lld)"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$LLD_PREFIX/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          which clang++ ld.lld llvm-ar || true
          clang++ --version
          ld.lld --version || true

      - name: Build engine
        env:
          QUANTA_ARCH_FLAGS: '-mcpu=apple-m1'
          QUANTA_EXTRA_CXXFLAGS: ${{ matrix.extra_flags }}
        run: |
          chmod +x build.sh
          ./build.sh 2>&1 | tee build-output.txt

      - name: What the build used
        run: |
          {
            echo '## Build (${{ matrix.variant }})'
            echo '```'
            clang++ --version | head -2
            grep -E "pgo|PGO|profdata|LTO|lld" build-output.txt | head -10 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "not readable by this clang" build-output.txt; then
            echo "::warning::the profile was still not readable: this build has no PGO"
          fi

      - name: Smoke test
        run: |
          echo 'console.log(1 + 2)' > /tmp/smoke.js
          build/bin/quanta /tmp/smoke.js
          otool -L build/bin/quanta
          # The executable has to export operator new for libc++.dylib's own allocations to land in the same allocator as ours.
          nm -gU build/bin/quanta | grep -E "_Znwm|_ZdlPv" || echo "(operator new is not exported)"
          # An allocation-heavy script that crashed a stripped build: strings, arrays, objects and the GC between them.
          cat > /tmp/alloc.js <<'JS'
          let keep = [];
          for (let i = 0; i < 400000; i++) { keep.push({ i, s: "k" + i, a: [i, i + 1] }); if (keep.length > 5000) keep = keep.slice(2500); }
          let t = 0; for (const o of keep) t += o.a[1] + o.s.length;
          console.log("alloc ok", t);
          JS
          build/bin/quanta /tmp/alloc.js

      - name: Package
        run: |
          mkdir -p dist
          cp build/bin/quanta dist/
          cp LICENSE dist/
          cd dist && zip -j ../quanta-macos-arm64-${{ matrix.variant }}.zip quanta LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: quanta-macos-arm64-${{ matrix.variant }}
          path: quanta-macos-arm64-${{ matrix.variant }}.zip

      - uses: actions/checkout@v4
        with:
          repository: ahaoboy/js-engine-benchmark
          ref: ${{ inputs.benchmark_ref }}
          path: bench

      - uses: oven-sh/setup-bun@v2

      - name: Build benchmark (dist/run.js)
        working-directory: bench
        run: |
          bun install
          bun run build
          ls -l dist/run.js

      - name: Run benchmark
        run: |
          build/bin/quanta bench/dist/run.js 2>&1 | tee benchmark-macos-arm64-${{ matrix.variant }}.txt
          {
            echo '## macOS (Apple Silicon), Homebrew LLVM, ${{ matrix.variant }}'
            echo '```'
            cat benchmark-macos-arm64-${{ matrix.variant }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-macos-arm64-${{ matrix.variant }}
          path: |
            benchmark-macos-arm64-${{ matrix.variant }}.txt
            build-output.txt
