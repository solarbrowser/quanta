name: Build (macOS)

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'src/**'
      - 'include/**'
      - 'console.cpp'
      - '.github/workflows/build-macos.yml'
  pull_request:
    paths:
      - 'build.sh'
      - 'src/**'
      - 'include/**'
      - 'console.cpp'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        # See build-linux.yml's identical note: -march=native would bake in
        # this specific runner's own Apple Silicon generation, which is not
        # guaranteed to match whoever downloads the artifact. apple-m1 is
        # the oldest generation and Apple's own ISA additions since have
        # stayed backward compatible with it.
        env:
          QUANTA_ARCH_FLAGS: '-mcpu=apple-m1'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Smoke test
        run: |
          echo 'console.log(1 + 2)' > /tmp/smoke.js
          build/bin/quanta /tmp/smoke.js

      - name: Octane suite (crash repro with backtrace)
        run: |
          git clone --depth 1 https://github.com/ahaoboy/js-engine-benchmark /tmp/jsb
          python3 -c "
          import re
          root = '/tmp/jsb/v8-v7/'
          s = open(root + 'run.js').read()
          out = re.sub(r\"load\\('([^']+)'\\);\", lambda m: open(root + m.group(1)).read(), s)
          open('/tmp/run_all.js', 'w').write(out)
          "
          # The benchmark harness strips the binary and reads stdout through a
          # pipe, so run both the plain and the stripped+piped variants.
          cp build/bin/quanta /tmp/quanta-plain
          cp build/bin/quanta /tmp/quanta-stripped
          strip /tmp/quanta-stripped
          status=0
          for bin in /tmp/quanta-plain /tmp/quanta-stripped; do
            echo "=== $bin (stdout piped) ==="
            if ! (cd /tmp && "$bin" /tmp/run_all.js 2>&1 | cat; exit "${PIPESTATUS[0]}"); then
              echo "$bin failed; backtrace follows"
              lldb --batch -o run -k "bt 30" -k "register read" -- "$bin" /tmp/run_all.js || true
              status=1
            fi
          done
          exit $status

      - name: Package
        run: |
          mkdir -p dist
          cp build/bin/quanta dist/
          cp LICENSE dist/
          cd dist && zip -j ../quanta-macos-arm64.zip quanta LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quanta-macos-arm64
          path: quanta-macos-arm64.zip
