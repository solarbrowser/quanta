name: Build (Linux)

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'src/**'
      - 'include/**'
      - 'console.cpp'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths:
      - 'build.sh'
      - 'src/**'
      - 'include/**'
      - 'console.cpp'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build
        # A distributed binary must not be built with -march=native: that
        # bakes in whatever instruction set THIS runner's own CPU happens to
        # support, and running it on a machine without one of those
        # extensions is an "illegal instruction" crash, not a graceful
        # fallback. sse4.2/avx/avx2 matches the fixed baseline
        # build-windows.bat already targets.
        env:
          QUANTA_ARCH_FLAGS: '-march=x86-64 -msse4.2 -mavx -mavx2 -mtune=haswell'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Smoke test
        run: |
          echo 'console.log(1 + 2)' > /tmp/smoke.js
          build/bin/quanta /tmp/smoke.js

      - name: Package
        run: |
          mkdir -p dist
          cp build/bin/quanta dist/
          cp LICENSE dist/
          cd dist && zip -j ../quanta-linux-x64.zip quanta LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quanta-linux-x64
          path: quanta-linux-x64.zip
